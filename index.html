<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Welcome | My Todo App</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        :root {
            --gold: #c58d43;
            --gold-dark: #a66c24;
            --ink: #252832;
            --muted: #777b86;
            --border: #e5e1d9;
        }

        * {
            box-sizing: border-box;
        }

        html {
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            margin: 0;
            padding: 28px 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, Helvetica, sans-serif;
            color: var(--ink);
            background:
                radial-gradient(ellipse at 12% 12%,
                    #f5dfbd 0%,
                    transparent 38%),
                radial-gradient(ellipse at 88% 88%,
                    #ead9bf 0%,
                    transparent 35%),
                #f8f5ef;
        }

        /* Main wrapper */
        .intro-wrapper {
            width: 100%;
            max-width: 480px;
            margin: auto;
        }

        /* Main card */
        .intro-card {
            width: 100%;
            padding: 42px 34px 28px;
            text-align: center;
            background: rgba(255, 255, 255, 0.94);
            border: 1px solid rgba(197, 141, 67, 0.2);
            border-radius: 24px;
            box-shadow: 0 18px 55px rgba(73, 56, 31, 0.10);
            animation: fadeUp 0.65s ease both;
        }

        /* Gold icon */
        .brand-mark {
            width: 64px;
            height: 64px;
            margin: 0 auto 23px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 19px;
            color: #fff;
            background: linear-gradient(135deg, #dfb875, #b77a32);
            box-shadow: 0 7px 18px rgba(183, 122, 50, 0.22);
            font-size: 29px;
        }

        /* Small label */
        .eyebrow {
            display: inline-block;
            margin-bottom: 19px;
            padding: 9px 15px;
            border: 1px solid rgba(197, 141, 67, 0.18);
            border-radius: 30px;
            background: #fbf5eb;
            color: var(--gold-dark);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.4px;
        }

        /* Heading */
        .heading {
            margin-bottom: 0;
        }

        .heading h1 {
            margin: 0 0 13px;
            color: var(--ink);
            font-size: clamp(27px, 6vw, 34px);
            font-weight: 750;
            line-height: 1.2;
            letter-spacing: -1px;
        }

        .heading-line {
            width: 44px;
            height: 3px;
            margin: 19px auto 23px;
            border-radius: 10px;
            background: var(--gold);
        }

        /* Description */
        .description {
            margin: 0 0 12px;
            color: var(--muted);
            font-size: 14px;
            line-height: 1.85;
        }

        .supporting-text {
            margin: 0;
            color: #8a8175;
            font-size: 13px;
            line-height: 1.7;
        }

        /* Get started button */
        .start-btn {
            width: 100%;
            min-height: 51px;
            margin-top: 27px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            border: none;
            border-radius: 11px;
            background: linear-gradient(110deg, #d7ad70, #b77b34);
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.2px;
            text-decoration: none;
            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }

        .start-btn:hover {
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(183, 122, 50, 0.23);
        }

        .start-btn:focus-visible {
            outline: 3px solid rgba(197, 141, 67, 0.35);
            outline-offset: 4px;
        }

        .arrow {
            display: inline-block;
            transition: transform 0.2s ease;
        }

        .start-btn:hover .arrow {
            transform: translateX(4px);
        }

        /* Footer */
        .footer {
            margin-top: 27px;
            padding-top: 19px;
            border-top: 1px solid #eee9e0;
            color: #92919a;
            font-size: 11px;
            letter-spacing: 0.7px;
        }

        /* Entrance animation */
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(14px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Accessibility */
        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }

        /* Mobile */
        @media (max-width: 576px) {
            body {
                padding: 20px 16px;
            }

            .intro-card {
                padding: 34px 23px 24px;
                border-radius: 21px;
            }

            .brand-mark {
                width: 58px;
                height: 58px;
                margin-bottom: 20px;
                border-radius: 17px;
            }

            .eyebrow {
                margin-bottom: 17px;
                font-size: 10px;
            }

            .heading-line {
                margin: 17px auto 20px;
            }

            .description {
                font-size: 14px;
            }

            .start-btn {
                margin-top: 23px;
            }

            .footer {
                margin-top: 23px;
            }
        }

        /* Short screens */
        @media (max-height: 600px) {
            body {
                padding-top: 16px;
                padding-bottom: 16px;
            }

            .intro-card {
                padding-top: 24px;
                padding-bottom: 20px;
            }

            .brand-mark {
                width: 46px;
                height: 46px;
                margin-bottom: 14px;
                font-size: 23px;
            }

            .eyebrow {
                margin-bottom: 12px;
            }

            .heading-line {
                margin-top: 12px;
                margin-bottom: 15px;
            }

            .start-btn {
                margin-top: 18px;
            }

            .footer {
                margin-top: 18px;
                padding-top: 13px;
            }
        }
    </style>
</head>

<body>

    <main class="intro-wrapper">
        <section class="intro-card">

            <div class="brand-mark" aria-hidden="true">
                📝
            </div>

            <span class="eyebrow">
                YOUR PERSONAL SPACE
            </span>

            <header class="heading">
                <h1>Welcome to My Todo App</h1>
                <div class="heading-line"></div>
            </header>

            <p class="description">
                Organize your daily tasks, manage your time,
                and stay productive with your personal
                Todo Dashboard.
            </p>

            <p class="supporting-text">
                Start your journey towards a more organized life!
            </p>

            <a href="./signup/signup.html" class="start-btn">
                Get Started 
                <span class="arrow" aria-hidden="true">→</span>
            </a>

            <footer class="footer">
                Stay Focused · Stay Productive
            </footer>

        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
