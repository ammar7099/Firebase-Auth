<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Your Account</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        :root {
            --gold: #c58d43;
            --gold-dark: #a66c24;
            --ink: #252832;
            --muted: #777b86;
            --border: #e5e1d9;
        }

        * {
            box-sizing: border-box;
        }

        html {
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            margin: 0;
            padding: 28px 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, Helvetica, sans-serif;
            color: var(--ink);
            background:
                radial-gradient(ellipse at 12% 12%, #f5dfbd 0%, transparent 38%),
                radial-gradient(ellipse at 88% 88%, #ead9bf 0%, transparent 35%),
                #f8f5ef;
        }

        .login-wrapper {
            width: 100%;
            max-width: 420px;
            margin: auto;
        }

        .login-card {
            width: 100%;
            padding: 38px 34px 28px;
            background: rgba(255, 255, 255, 0.94);
            border: 1px solid rgba(197, 141, 67, 0.2);
            border-radius: 24px;
            box-shadow: 0 18px 55px rgba(73, 56, 31, 0.10);
        }

        .brand-mark {
            width: 52px;
            height: 52px;
            margin: 0 auto 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 17px;
            color: white;
            background: linear-gradient(135deg, #dfb875, #b77a32);
            box-shadow: 0 7px 18px rgba(183, 122, 50, 0.22);
            font-size: 24px;
            font-weight: 700;
        }

        .heading {
            text-align: center;
            margin-bottom: 30px;
        }

        .heading h1 {
            margin: 0 0 9px;
            font-size: clamp(27px, 6vw, 32px);
            font-weight: 750;
            letter-spacing: -1px;
        }

        .heading p {
            margin: 0;
            color: var(--muted);
            font-size: 14px;
            line-height: 1.6;
        }

        .heading-line {
            width: 44px;
            height: 3px;
            margin: 19px auto 0;
            border-radius: 10px;
            background: var(--gold);
        }

        .field-group {
            margin-bottom: 19px;
        }

        .form-label {
            margin-bottom: 8px;
            color: #373944;
            font-size: 14px;
            font-weight: 600;
        }

        .form-control {
            width: 100%;
            min-height: 49px;
            padding: 12px 14px;
            border: 1px solid var(--border);
            border-radius: 11px;
            background: #fdfcf9;
            color: var(--ink);
            font-size: 15px;
            box-shadow: none;
        }

        .form-control::placeholder {
            color: #a1a2a8;
        }

        .form-control:focus {
            border-color: var(--gold);
            background: #fff;
            box-shadow: 0 0 0 3px rgba(197, 141, 67, 0.13);
        }

        .submit-btn {
            width: 100%;
            min-height: 51px;
            margin-top: 7px;
            border: none;
            border-radius: 11px;
            background: linear-gradient(110deg, #d7ad70, #b77b34);
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.2px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .submit-btn:hover {
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(183, 122, 50, 0.23);
        }

        .account-prompt {
            margin: 24px 0 0;
            text-align: center;
            color: var(--muted);
            font-size: 14px;
        }

        .account-prompt a {
            color: var(--gold-dark);
            font-weight: 700;
            text-decoration: none;
        }

        .account-prompt a:hover {
            text-decoration: underline;
        }

        .security-note {
            margin-top: 25px;
            padding-top: 18px;
            border-top: 1px solid #eee9e0;
            color: #92919a;
            text-align: center;
            font-size: 11px;
            letter-spacing: 0.5px;
        }

        @media (max-width: 576px) {
            body {
                padding: 20px 16px;
            }

            .login-wrapper {
                max-width: 420px;
            }

            .login-card {
                padding: 30px 22px 24px;
                border-radius: 21px;
            }

            .heading {
                margin-bottom: 25px;
            }

            .brand-mark {
                margin-bottom: 19px;
            }

            .field-group {
                margin-bottom: 17px;
            }
        }

        @media (max-height: 600px) and (min-width: 577px) {
            body {
                padding-top: 14px;
                padding-bottom: 14px;
            }

            .login-card {
                padding-top: 22px;
                padding-bottom: 20px;
            }

            .brand-mark {
                width: 42px;
                height: 42px;
                margin-bottom: 12px;
            }

            .heading {
                margin-bottom: 18px;
            }

            .heading-line {
                margin-top: 12px;
            }

            .field-group {
                margin-bottom: 12px;
            }

            .security-note {
                margin-top: 16px;
                padding-top: 12px;
            }
        }
    </style>
</head>

<body>

    <main class="login-wrapper">
        <section class="login-card">


            <header class="heading">
                <h1>Welcome Back</h1>
                <p>Sign in to continue to your account.</p>
                <div class="heading-line"></div>
            </header>

            <form id="login-form">

                <div class="field-group">
                    <label for="login-email" class="form-label">Email Address</label>
                    <input type="email" class="form-control" id="login-email" placeholder="you@example.com"
                        autocomplete="email" required>
                </div>

                <div class="field-group">
                    <label for="login-password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="login-password" placeholder="Enter your password"
                        autocomplete="current-password" required>
                </div>

                <button type="submit" class="submit-btn">
                    Login to Account
                </button>

            </form>

            <p class="account-prompt">
                Don't have an account?
                <a href="../signup/signup.html">Create Account</a>
            </p>

            

        </section>
    </main>

    <script type="module" src="../firebase.config.js"></script>
    <script type="module" src="../index.js"></script>

</body>

</html>
