<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | My Tasks</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        :root {
            --gold: #c58d43;
            --gold-dark: #a66c24;
            --ink: #252832;
            --muted: #777b86;
            --border: #e8e2d8;
            --surface: #ffffff;
            --cream: #f8f5ef;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            color: var(--ink);
            font-family: Arial, Helvetica, sans-serif;
            background:
                radial-gradient(ellipse at 5% 0%, #f2dfc2 0%, transparent 34%),
                radial-gradient(ellipse at 100% 100%, #eee0ca 0%, transparent 30%),
                var(--cream);
        }

        .topbar {
            width: 100%;
            padding: 17px 5%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            background: rgba(255, 255, 255, 0.86);
            border-bottom: 1px solid rgba(197, 141, 67, 0.18);
            box-shadow: 0 4px 20px rgba(60, 47, 30, 0.035);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 19px;
            font-weight: 750;
            letter-spacing: -0.4px;
        }

        .brand-mark {
            width: 39px;
            height: 39px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            color: #fff;
            background: linear-gradient(135deg, #dfb875, #b77a32);
            font-size: 19px;
            font-weight: 700;
        }

        .logout-btn {
            padding: 10px 17px;
            border: 1px solid #e4d4bd;
            border-radius: 10px;
            background: #fff;
            color: #805521;
            font-size: 14px;
            font-weight: 700;
            transition: background 0.2s ease;
        }

        .logout-btn:hover {
            background: #fbf1e2;
        }

        .dashboard-container {
            width: 100%;
            max-width: 850px;
            margin: 0 auto;
            padding: 52px 24px 40px;
        }

        .welcome-section {
            margin-bottom: 30px;
        }

        .eyebrow {
            margin-bottom: 10px;
            color: var(--gold-dark);
            font-size: 12px;
            font-weight: 750;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        #greeting-text {
            margin: 0 0 10px;
            font-size: clamp(27px, 4vw, 37px);
            font-weight: 750;
            line-height: 1.25;
            letter-spacing: -1.1px;
            overflow-wrap: anywhere;
        }

        .welcome-description {
            margin: 0;
            color: var(--muted);
            font-size: 15px;
            line-height: 1.7;
        }

        .todo-card {
            padding: 30px;
            border: 1px solid rgba(197, 141, 67, 0.18);
            border-radius: 22px;
            background: var(--surface);
            box-shadow: 0 14px 42px rgba(73, 56, 31, 0.07);
        }

        .todo-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 23px;
        }

        .todo-header h3 {
            margin: 0;
            font-size: 21px;
            font-weight: 750;
            letter-spacing: -0.4px;
        }

        .task-label {
            padding: 7px 11px;
            border-radius: 20px;
            background: #fbf1e2;
            color: #8b6029;
            font-size: 11px;
            font-weight: 700;
            white-space: nowrap;
        }

        .todo-form {
            display: flex;
            align-items: stretch;
            gap: 11px;
        }

        #todo-input {
            min-width: 0;
            min-height: 49px;
            flex: 1;
            padding: 12px 15px;
            border: 1px solid var(--border);
            border-radius: 11px;
            outline: none;
            background: #fdfcf9;
            color: var(--ink);
            font-size: 14px;
        }

        #todo-input::placeholder {
            color: #a1a2a8;
        }

        #todo-input:focus {
            border-color: var(--gold);
            background: #fff;
            box-shadow: 0 0 0 3px rgba(197, 141, 67, 0.12);
        }

        #todo-btn {
            min-height: 49px;
            padding: 12px 20px;
            border: none;
            border-radius: 11px;
            background: linear-gradient(110deg, #d7ad70, #b77b34);
            color: #fff;
            font-size: 14px;
            font-weight: 750;
            white-space: nowrap;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        #todo-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(183, 122, 50, 0.2);
        }

        #todo-message {
            min-height: 20px;
            margin: 11px 0 0;
            font-size: 13px;
            overflow-wrap: anywhere;
        }

        #todos {
            display: flex;
            flex-direction: column;
            gap: 11px;
            margin: 20px 0 0;
            padding: 0;
            list-style: none;
        }

        #todos:empty {
            display: none;
        }

        #todos li {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 15px 16px;
            border: 1px solid #eee9e0;
            border-radius: 12px;
            background: #fdfcf9;
            overflow-wrap: anywhere;
        }

        #todos li button {
            flex-shrink: 0;
            padding: 7px 11px;
            border: 1px solid #ecd9d6;
            border-radius: 8px;
            background: #fff8f7;
            color: #a34d45;
            font-size: 12px;
            font-weight: 700;
        }

        #todos li button:hover {
            background: #fbe9e6;
        }

        .bottom-note {
            margin-top: 25px;
            color: #92919a;
            text-align: center;
            font-size: 12px;
        }

        @media (max-width: 576px) {
            .topbar {
                padding: 14px 16px;
            }

            .brand {
                gap: 9px;
                font-size: 16px;
            }

            .brand-mark {
                width: 35px;
                height: 35px;
                border-radius: 10px;
            }

            .logout-btn {
                padding: 9px 12px;
                font-size: 12px;
            }

            .dashboard-container {
                padding: 35px 16px 28px;
            }

            .welcome-section {
                margin-bottom: 23px;
            }

            #greeting-text {
                letter-spacing: -0.7px;
            }

            .welcome-description {
                font-size: 14px;
            }

            .todo-card {
                padding: 22px 17px;
                border-radius: 18px;
            }

            .todo-header {
                margin-bottom: 19px;
            }

            .todo-header h3 {
                font-size: 19px;
            }

            .task-label {
                padding: 6px 8px;
                font-size: 10px;
            }

            .todo-form {
                flex-direction: column;
            }

            #todo-input,
            #todo-btn {
                width: 100%;
                min-height: 47px;
            }

            #todo-btn {
                padding: 12px;
            }

            #todos li {
                padding: 12px;
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

    <nav class="topbar">
        <div class="brand">
            
            <span>My Dashboard</span>
        </div>

        <button type="button" id="logout" class="logout-btn">
            Logout
        </button>
    </nav>

    <main class="dashboard-container">

        <section class="welcome-section">
            <div class="eyebrow">Your personal workspace</div>

            <h2 id="greeting-text">Loading dashboard...</h2>

            <p class="welcome-description">
                Keep your tasks organized and make progress one step at a time.
            </p>
        </section>

        <section class="todo-card">
            <div class="todo-header">
                <h3>My Tasks</h3>
                <span class="task-label">TASK MANAGER</span>
            </div>

            <form id="todo-form" class="todo-form">
                <input type="text" id="todo-input" placeholder="What needs to get done?" aria-label="New todo"
                    autocomplete="off" required>

                <button type="submit" id="todo-btn">
                    + Add Task
                </button>
            </form>

            <p id="todo-message" role="status" aria-live="polite"></p>

            <ul id="todos"></ul>
        </section>

        <div class="bottom-note">
            A little progress each day adds up.
        </div>

    </main>

    <script type="module" src="../firebase.config.js"></script>
    <script type="module" src="../index.js"></script>
    <script type="module" src="./dashboard.js"></script>

</body>

</html>
